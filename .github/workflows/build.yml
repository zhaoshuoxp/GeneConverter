name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: GeneConverter-linux-x86_64
            kind: linux
          - os: windows-2025
            artifact: GeneConverter-windows-x86_64
            kind: windows
          - os: macos-15
            artifact: GeneConverter-macos-arm64
            kind: macos
          - os: macos-15-intel
            artifact: GeneConverter-macos-x86_64
            kind: macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --locked

      - name: Build release executable
        run: cargo build --release --locked

      - name: Package Linux
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          mkdir -p package
          cp target/release/gene-converter package/GeneConverter
          cp readme.md LICENSE package/
          tar -czf "${{ matrix.artifact }}.tar.gz" -C package .

      - name: Package Windows
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package
          Copy-Item target/release/gene-converter.exe package/GeneConverter.exe
          Copy-Item readme.md, LICENSE package/
          Compress-Archive -Path package/* -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Build macOS app bundle
        if: matrix.kind == 'macos'
        shell: bash
        run: |
          cargo install cargo-bundle --version 0.11.0 --locked
          cargo bundle --release
          ditto -c -k --sequesterRsrc --keepParent target/release/bundle/osx/GeneConverter.app "${{ matrix.artifact }}.zip"
          cp target/release/bundle/dmg/GeneConverter.dmg "${{ matrix.artifact }}.dmg"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
